[project]
name = "nyc-taxi-data-platform"
version = "0.1.0"
description = "End-to-end data pipeline: NYC taxi data → DuckDB → dbt → FastAPI"
readme = "README.md"
authors = [
    { name = "Gideonosekre23", email = "weemanosekre@yahoo.com" }
]
requires-python = ">=3.12"
